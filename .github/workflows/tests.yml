name: tests

on:
  push:
    branches: [dev_test]
  pull_request:
    branches: [dev]

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
      - run: python -m pip install --upgrade pip pytest requests fastapi 'httpx<0.28' websockets python-multipart
      - run: python -m compileall -q server tests
      - run: python -m pytest -q
  javascript:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check web/dashboard/app.js
      - run: node --check web/dashboard/builder.js
      - run: node --check web/overlay/overlay.js
